name: Offline validation
on:
  pull_request:
  push:
    branches: [codex/issue-1-auditable-data-ingestion]
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    name: Python ${{ matrix.python }} offline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10.19', '3.12.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Synthetic tests and local CLI checks
        run: python scripts/check_offline.py
      - name: Compile and indentation checks
        run: |
          python -m compileall -q methanol tests scripts
          python -m tabnanny methanol tests scripts
          git diff --check
